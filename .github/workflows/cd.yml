name: CD - Build and Push Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  prepare:
    name: Prepare Version Info
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      docker_username: ${{ steps.docker_user.outputs.USERNAME }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Docker username
        id: docker_user
        run: |
          if [[ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]]; then
            echo "USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> $GITHUB_OUTPUT
          else
            echo "USERNAME=${{ github.repository_owner }}" >> $GITHUB_OUTPUT
          fi
          echo "Using Docker username: $(cat $GITHUB_OUTPUT | grep USERNAME | cut -d= -f2)"

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: prepare
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ needs.prepare.outputs.docker_username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ secrets.DOCKERHUB_TOKEN != '' }}
          tags: |
            ${{ needs.prepare.outputs.docker_username }}/todo-app:${{ needs.prepare.outputs.version }}
            ${{ needs.prepare.outputs.docker_username }}/todo-app:latest
          cache-from: type=registry,ref=${{ needs.prepare.outputs.docker_username }}/todo-app:latest
          cache-to: type=inline

      - name: Image digest
        run: echo "Image built and pushed successfully!"

  report:
    name: Deployment Report
    runs-on: ubuntu-latest
    needs: [prepare, build-and-push]
    if: always()
    
    steps:
      - name: Image pushed summary
        run: |
          echo "### ✅ CD Pipeline Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Jobs Status:**" >> $GITHUB_STEP_SUMMARY
          echo "- Prepare: ${{ needs.prepare.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build and Push: ${{ needs.build-and-push.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Details:**" >> $GITHUB_STEP_SUMMARY
          echo "- Version: \`${{ needs.prepare.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Repository: \`${{ needs.prepare.outputs.docker_username }}/todo-app\`" >> $GITHUB_STEP_SUMMARY
