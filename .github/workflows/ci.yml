name: CI - Tests and Lint

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install linting tools
        run: |
          pip install --upgrade pip
          pip install flake8 black
      
      - name: Run flake8 (syntax and style checks)
        working-directory: ./app
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Check black formatting
        working-directory: ./app
        run: |
          black --check --diff .

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        working-directory: ./app
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run pytest with coverage
        working-directory: ./app
        run: |
          pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=xml
      
      - name: Run legacy integration tests
        working-directory: ./app
        run: |
          pytest test_parser.py -v || true
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./app/coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
