name: CICD - Complete Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Allow manual trigger

jobs:
  # CI JOBS
  setup:
    name: Setup Python Environment
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Display Python environment
        run: |
          python --version
          pip --version

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    needs: setup
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint with flake8
        run: |
          cd app
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,__pycache__,.pytest_cache
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=venv,__pycache__,.pytest_cache

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: setup
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f app/requirements.txt ]; then
            pip install -r app/requirements.txt
          fi
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          cd app
          python -m pytest tests/ -v --tb=short --cov=. --cov-report=term-missing
        continue-on-error: false

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/.coverage

  # CD JOBS
  prepare-version:
    name: Prepare Version
    runs-on: ubuntu-latest
    needs: [lint, test]
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      docker_username: ${{ steps.docker_user.outputs.USERNAME }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Docker username
        id: docker_user
        run: |
          # Use DOCKERHUB_USERNAME secret if available, otherwise use repository owner
          DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          if [[ -z "$DOCKER_USER" ]]; then
            DOCKER_USER="${{ github.repository_owner }}"
          fi
          echo "USERNAME=$DOCKER_USER" >> $GITHUB_OUTPUT
          echo "Using Docker username: $DOCKER_USER"

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

  build-and-push-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: prepare-version
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker username
        run: |
          USERNAME="${{ needs.prepare-version.outputs.docker_username }}"
          if [[ -z "$USERNAME" ]]; then
            echo "Error: Docker username is empty"
            echo "DOCKERHUB_USERNAME secret: ${{ secrets.DOCKERHUB_USERNAME != '' && 'set' || 'not set' }}"
            echo "Repository owner: ${{ github.repository_owner }}"
            exit 1
          fi
          echo "Using Docker username: $USERNAME"

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ needs.prepare-version.outputs.docker_username || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ secrets.DOCKERHUB_TOKEN != '' }}
          tags: |
            ${{ needs.prepare-version.outputs.docker_username || github.repository_owner }}/todo-app:${{ needs.prepare-version.outputs.version }}
            ${{ needs.prepare-version.outputs.docker_username || github.repository_owner }}/todo-app:latest
          cache-from: type=registry,ref=${{ needs.prepare-version.outputs.docker_username || github.repository_owner }}/todo-app:latest
          cache-to: type=inline

      - name: Image digest
        run: echo "Image built and pushed successfully!"

  report:
    name: Pipeline Report
    runs-on: ubuntu-latest
    needs: [setup, lint, test, prepare-version, build-and-push-image]
    if: always()
    
    steps:
      - name: Pipeline summary
        run: |
          echo "### ✅ CICD Pipeline Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**CI Jobs:**" >> $GITHUB_STEP_SUMMARY
          echo "- Setup: ${{ needs.setup.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Test: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**CD Jobs:**" >> $GITHUB_STEP_SUMMARY
          echo "- Prepare Version: ${{ needs.prepare-version.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build and Push Image: ${{ needs.build-and-push-image.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Details:**" >> $GITHUB_STEP_SUMMARY
          echo "- Version: \`${{ needs.prepare-version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Repository: \`${{ needs.prepare-version.outputs.docker_username }}/todo-app\`" >> $GITHUB_STEP_SUMMARY
